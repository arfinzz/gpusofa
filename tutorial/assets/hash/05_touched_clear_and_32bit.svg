<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 680 214" role="img"><title>Clear only touched slots, and pack pairs into 32 bits</title><desc>The dedup table clears only the slots used last frame, and a candidate pair packs into a single 32-bit key when both meshes have at most 65,535 triangles.</desc><style>:root{--bg2:#f6f5f1;--bdr:rgba(0,0,0,.16);--bdr2:rgba(0,0,0,.30);--bdr3:rgba(0,0,0,.42);--tp:#26251f;--tsd:#5f5e5a;--color-background-secondary:var(--bg2);--color-border-tertiary:var(--bdr);--color-border-secondary:var(--bdr2);--color-border-primary:var(--bdr3);--color-text-primary:var(--tp);}svg{font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Arial,sans-serif;}text.t{font-size:14px;fill:var(--tp);}text.ts{font-size:12px;fill:var(--tsd);}text.th{font-size:14px;font-weight:500;fill:var(--tp);}.c-teal>rect,.c-teal>circle,rect.c-teal{fill:#E1F5EE;stroke:#0F6E56;}.c-teal>text{fill:#04342C;}.c-teal>.ts{fill:#0F6E56;}.c-coral>rect,rect.c-coral{fill:#FAECE7;stroke:#993C1D;}.c-coral>text{fill:#4A1B0C;}.c-coral>.ts{fill:#993C1D;}.c-green>rect,rect.c-green{fill:#EAF3DE;stroke:#3B6D11;}.c-green>text{fill:#173404;}.c-green>.ts{fill:#3B6D11;}.c-gray>rect,rect.c-gray{fill:#F1EFE8;stroke:#5F5E5A;}.c-gray>text{fill:#2C2C2A;}.c-gray>.ts{fill:#5F5E5A;}.c-purple>rect,rect.c-purple{fill:#EEEDFE;stroke:#534AB7;}.c-purple>text{fill:#26215C;}.c-purple>.ts{fill:#534AB7;}.c-blue>rect,rect.c-blue{fill:#E6F1FB;stroke:#185FA5;}.c-blue>text{fill:#042C53;}.c-blue>.ts{fill:#185FA5;}.c-amber>rect,rect.c-amber{fill:#FAEEDA;stroke:#854F0B;}.c-amber>text{fill:#412402;}.c-amber>.ts{fill:#854F0B;}.c-red>rect,rect.c-red{fill:#FCEBEB;stroke:#A32D2D;}.c-red>text{fill:#501313;}.c-red>.ts{fill:#A32D2D;}@media (prefers-color-scheme:dark){:root{--bg2:#26261f;--bdr:rgba(255,255,255,.20);--bdr2:rgba(255,255,255,.34);--bdr3:rgba(255,255,255,.48);--tp:#f1efe8;--tsd:#b4b2a9;}.c-teal>rect,rect.c-teal{fill:#085041;stroke:#5DCAA5;}.c-teal>text{fill:#E1F5EE;}.c-teal>.ts{fill:#9FE1CB;}.c-coral>rect,rect.c-coral{fill:#712B13;stroke:#F0997B;}.c-coral>text{fill:#FAECE7;}.c-coral>.ts{fill:#F0997B;}.c-green>rect,rect.c-green{fill:#27500A;stroke:#C0DD97;}.c-green>text{fill:#EAF3DE;}.c-green>.ts{fill:#C0DD97;}.c-gray>rect,rect.c-gray{fill:#444441;stroke:#B4B2A9;}.c-gray>text{fill:#F1EFE8;}.c-gray>.ts{fill:#D3D1C7;}.c-purple>rect,rect.c-purple{fill:#3C3489;stroke:#AFA9EC;}.c-purple>text{fill:#EEEDFE;}.c-purple>.ts{fill:#CECBF6;}.c-blue>rect,rect.c-blue{fill:#0C447C;stroke:#85B7EB;}.c-blue>text{fill:#E6F1FB;}.c-blue>.ts{fill:#B5D4F4;}.c-amber>rect,rect.c-amber{fill:#633806;stroke:#EF9F27;}.c-amber>text{fill:#FAEEDA;}.c-amber>.ts{fill:#FAC775;}.c-red>rect,rect.c-red{fill:#791F1F;stroke:#F09595;}.c-red>text{fill:#FCEBEB;}.c-red>.ts{fill:#F7C1C1;}}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><line x1="350" y1="54" x2="350" y2="198" stroke="var(--color-border-tertiary)" stroke-dasharray="4 3" stroke-width="0.5"/><text class="th" x="185" y="62" text-anchor="middle" dominant-baseline="central">trick 4 · clear only touched</text><rect x="48" y="82" width="300" height="28" rx="4" fill="var(--color-background-secondary)" stroke="var(--color-border-tertiary)" stroke-width="0.5"/><rect class="c-amber" x="104" y="82" width="8" height="28" stroke-width="0.5"/><rect class="c-amber" x="190" y="82" width="8" height="28" stroke-width="0.5"/><rect class="c-amber" x="276" y="82" width="8" height="28" stroke-width="0.5"/><g class="c-amber"><rect x="96" y="126" width="208" height="30" rx="4" stroke-width="0.5"/><text class="ts" x="200" y="141" text-anchor="middle" dominant-baseline="central">touched = s2, s7, s9</text></g><text class="ts" x="200" y="182" text-anchor="middle" dominant-baseline="central">wipe ~3 slots, not millions</text><text class="th" x="512" y="62" text-anchor="middle" dominant-baseline="central">trick 5 · 32-bit pair key</text><g class="c-teal"><rect x="396" y="82" width="100" height="30" rx="4" stroke-width="0.5"/><text class="ts" x="446" y="97" text-anchor="middle" dominant-baseline="central">tissue 16b</text></g><g class="c-coral"><rect x="500" y="82" width="100" height="30" rx="4" stroke-width="0.5"/><text class="ts" x="550" y="97" text-anchor="middle" dominant-baseline="central">tool 16b</text></g><line x1="446" y1="112" x2="486" y2="130" stroke="var(--color-border-primary)" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="550" y1="112" x2="534" y2="130" stroke="var(--color-border-primary)" stroke-width="1.5" marker-end="url(#arrow)"/><g class="c-green"><rect x="430" y="132" width="160" height="30" rx="4" stroke-width="0.5"/><text class="ts" x="510" y="147" text-anchor="middle" dominant-baseline="central">32-bit pair key</text></g><text class="ts" x="512" y="182" text-anchor="middle" dominant-baseline="central">half the bandwidth vs 64-bit</text></svg>