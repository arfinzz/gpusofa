<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 680 290" role="img"><title>Allocation: dense grid versus spatial hash</title><desc>The dense grid reserves all 32,768 cells every frame though only about thirty are used; the spatial hash gives a slot only to occupied cells.</desc><style>:root{--bg2:#f6f5f1;--bdr:rgba(0,0,0,.16);--bdr2:rgba(0,0,0,.30);--bdr3:rgba(0,0,0,.42);--tp:#26251f;--tsd:#5f5e5a;--color-background-secondary:var(--bg2);--color-border-tertiary:var(--bdr);--color-border-secondary:var(--bdr2);--color-border-primary:var(--bdr3);--color-text-primary:var(--tp);}svg{font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Arial,sans-serif;}text.t{font-size:14px;fill:var(--tp);}text.ts{font-size:12px;fill:var(--tsd);}text.th{font-size:14px;font-weight:500;fill:var(--tp);}.c-teal>rect,.c-teal>circle,rect.c-teal{fill:#E1F5EE;stroke:#0F6E56;}.c-teal>text{fill:#04342C;}.c-teal>.ts{fill:#0F6E56;}.c-coral>rect,rect.c-coral{fill:#FAECE7;stroke:#993C1D;}.c-coral>text{fill:#4A1B0C;}.c-coral>.ts{fill:#993C1D;}.c-green>rect,rect.c-green{fill:#EAF3DE;stroke:#3B6D11;}.c-green>text{fill:#173404;}.c-green>.ts{fill:#3B6D11;}.c-gray>rect,rect.c-gray{fill:#F1EFE8;stroke:#5F5E5A;}.c-gray>text{fill:#2C2C2A;}.c-gray>.ts{fill:#5F5E5A;}.c-purple>rect,rect.c-purple{fill:#EEEDFE;stroke:#534AB7;}.c-purple>text{fill:#26215C;}.c-purple>.ts{fill:#534AB7;}.c-blue>rect,rect.c-blue{fill:#E6F1FB;stroke:#185FA5;}.c-blue>text{fill:#042C53;}.c-blue>.ts{fill:#185FA5;}.c-amber>rect,rect.c-amber{fill:#FAEEDA;stroke:#854F0B;}.c-amber>text{fill:#412402;}.c-amber>.ts{fill:#854F0B;}.c-red>rect,rect.c-red{fill:#FCEBEB;stroke:#A32D2D;}.c-red>text{fill:#501313;}.c-red>.ts{fill:#A32D2D;}@media (prefers-color-scheme:dark){:root{--bg2:#26261f;--bdr:rgba(255,255,255,.20);--bdr2:rgba(255,255,255,.34);--bdr3:rgba(255,255,255,.48);--tp:#f1efe8;--tsd:#b4b2a9;}.c-teal>rect,rect.c-teal{fill:#085041;stroke:#5DCAA5;}.c-teal>text{fill:#E1F5EE;}.c-teal>.ts{fill:#9FE1CB;}.c-coral>rect,rect.c-coral{fill:#712B13;stroke:#F0997B;}.c-coral>text{fill:#FAECE7;}.c-coral>.ts{fill:#F0997B;}.c-green>rect,rect.c-green{fill:#27500A;stroke:#C0DD97;}.c-green>text{fill:#EAF3DE;}.c-green>.ts{fill:#C0DD97;}.c-gray>rect,rect.c-gray{fill:#444441;stroke:#B4B2A9;}.c-gray>text{fill:#F1EFE8;}.c-gray>.ts{fill:#D3D1C7;}.c-purple>rect,rect.c-purple{fill:#3C3489;stroke:#AFA9EC;}.c-purple>text{fill:#EEEDFE;}.c-purple>.ts{fill:#CECBF6;}.c-blue>rect,rect.c-blue{fill:#0C447C;stroke:#85B7EB;}.c-blue>text{fill:#E6F1FB;}.c-blue>.ts{fill:#B5D4F4;}.c-amber>rect,rect.c-amber{fill:#633806;stroke:#EF9F27;}.c-amber>text{fill:#FAEEDA;}.c-amber>.ts{fill:#FAC775;}.c-red>rect,rect.c-red{fill:#791F1F;stroke:#F09595;}.c-red>text{fill:#FCEBEB;}.c-red>.ts{fill:#F7C1C1;}}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><text class="th" x="160" y="58" text-anchor="middle" dominant-baseline="central">dense grid (default)</text><text class="th" x="500" y="58" text-anchor="middle" dominant-baseline="central">spatial hash (opt-in)</text><rect x="60" y="82" width="200" height="100" rx="4" fill="none" stroke="var(--color-border-secondary)" stroke-dasharray="4 3" stroke-width="0.5"/><line x1="85" y1="82" x2="85" y2="182" stroke="var(--color-border-tertiary)" stroke-width="0.5"/><line x1="110" y1="82" x2="110" y2="182" stroke="var(--color-border-tertiary)" stroke-width="0.5"/><line x1="135" y1="82" x2="135" y2="182" stroke="var(--color-border-tertiary)" stroke-width="0.5"/><line x1="160" y1="82" x2="160" y2="182" stroke="var(--color-border-tertiary)" stroke-width="0.5"/><line x1="185" y1="82" x2="185" y2="182" stroke="var(--color-border-tertiary)" stroke-width="0.5"/><line x1="210" y1="82" x2="210" y2="182" stroke="var(--color-border-tertiary)" stroke-width="0.5"/><line x1="235" y1="82" x2="235" y2="182" stroke="var(--color-border-tertiary)" stroke-width="0.5"/><line x1="60" y1="107" x2="260" y2="107" stroke="var(--color-border-tertiary)" stroke-width="0.5"/><line x1="60" y1="132" x2="260" y2="132" stroke="var(--color-border-tertiary)" stroke-width="0.5"/><line x1="60" y1="157" x2="260" y2="157" stroke="var(--color-border-tertiary)" stroke-width="0.5"/><rect class="c-teal" x="88" y="85" width="19" height="19" rx="2" stroke-width="0.5"/><rect class="c-coral" x="163" y="110" width="19" height="19" rx="2" stroke-width="0.5"/><rect class="c-green" x="213" y="135" width="19" height="19" rx="2" stroke-width="0.5"/><text class="ts" x="160" y="200" text-anchor="middle" dominant-baseline="central">32,768 cells allocated, ~30 used</text><rect class="c-teal" x="396" y="120" width="28" height="28" rx="4" stroke-width="0.5"/><rect x="432" y="120" width="28" height="28" rx="4" fill="var(--color-background-secondary)" stroke="var(--color-border-tertiary)" stroke-dasharray="3 2" stroke-width="0.5"/><rect class="c-coral" x="468" y="120" width="28" height="28" rx="4" stroke-width="0.5"/><rect x="504" y="120" width="28" height="28" rx="4" fill="var(--color-background-secondary)" stroke="var(--color-border-tertiary)" stroke-dasharray="3 2" stroke-width="0.5"/><rect class="c-green" x="540" y="120" width="28" height="28" rx="4" stroke-width="0.5"/><rect x="576" y="120" width="28" height="28" rx="4" fill="var(--color-background-secondary)" stroke="var(--color-border-tertiary)" stroke-dasharray="3 2" stroke-width="0.5"/><text class="ts" x="500" y="200" text-anchor="middle" dominant-baseline="central">only occupied cells get a slot</text><rect class="c-teal" x="150" y="226" width="12" height="12" rx="2" stroke-width="0.5"/><text class="ts" x="168" y="232" text-anchor="start" dominant-baseline="central">tissue cell</text><rect class="c-coral" x="268" y="226" width="12" height="12" rx="2" stroke-width="0.5"/><text class="ts" x="286" y="232" text-anchor="start" dominant-baseline="central">tool cell</text><rect class="c-green" x="386" y="226" width="12" height="12" rx="2" stroke-width="0.5"/><text class="ts" x="404" y="232" text-anchor="start" dominant-baseline="central">both → candidate pairs</text></svg>