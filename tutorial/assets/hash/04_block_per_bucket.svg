<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 680 292" role="img"><title>One block per bucket replaces per-pair binary search</title><desc>Instead of one thread per pair doing a binary search, one block handles a whole mixed bucket and recovers each pair by dividing and taking the modulo of the lane index.</desc><style>:root{--bg2:#f6f5f1;--bdr:rgba(0,0,0,.16);--bdr2:rgba(0,0,0,.30);--bdr3:rgba(0,0,0,.42);--tp:#26251f;--tsd:#5f5e5a;--color-background-secondary:var(--bg2);--color-border-tertiary:var(--bdr);--color-border-secondary:var(--bdr2);--color-border-primary:var(--bdr3);--color-text-primary:var(--tp);}svg{font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Arial,sans-serif;}text.t{font-size:14px;fill:var(--tp);}text.ts{font-size:12px;fill:var(--tsd);}text.th{font-size:14px;font-weight:500;fill:var(--tp);}.c-teal>rect,.c-teal>circle,rect.c-teal{fill:#E1F5EE;stroke:#0F6E56;}.c-teal>text{fill:#04342C;}.c-teal>.ts{fill:#0F6E56;}.c-coral>rect,rect.c-coral{fill:#FAECE7;stroke:#993C1D;}.c-coral>text{fill:#4A1B0C;}.c-coral>.ts{fill:#993C1D;}.c-green>rect,rect.c-green{fill:#EAF3DE;stroke:#3B6D11;}.c-green>text{fill:#173404;}.c-green>.ts{fill:#3B6D11;}.c-gray>rect,rect.c-gray{fill:#F1EFE8;stroke:#5F5E5A;}.c-gray>text{fill:#2C2C2A;}.c-gray>.ts{fill:#5F5E5A;}.c-purple>rect,rect.c-purple{fill:#EEEDFE;stroke:#534AB7;}.c-purple>text{fill:#26215C;}.c-purple>.ts{fill:#534AB7;}.c-blue>rect,rect.c-blue{fill:#E6F1FB;stroke:#185FA5;}.c-blue>text{fill:#042C53;}.c-blue>.ts{fill:#185FA5;}.c-amber>rect,rect.c-amber{fill:#FAEEDA;stroke:#854F0B;}.c-amber>text{fill:#412402;}.c-amber>.ts{fill:#854F0B;}.c-red>rect,rect.c-red{fill:#FCEBEB;stroke:#A32D2D;}.c-red>text{fill:#501313;}.c-red>.ts{fill:#A32D2D;}@media (prefers-color-scheme:dark){:root{--bg2:#26261f;--bdr:rgba(255,255,255,.20);--bdr2:rgba(255,255,255,.34);--bdr3:rgba(255,255,255,.48);--tp:#f1efe8;--tsd:#b4b2a9;}.c-teal>rect,rect.c-teal{fill:#085041;stroke:#5DCAA5;}.c-teal>text{fill:#E1F5EE;}.c-teal>.ts{fill:#9FE1CB;}.c-coral>rect,rect.c-coral{fill:#712B13;stroke:#F0997B;}.c-coral>text{fill:#FAECE7;}.c-coral>.ts{fill:#F0997B;}.c-green>rect,rect.c-green{fill:#27500A;stroke:#C0DD97;}.c-green>text{fill:#EAF3DE;}.c-green>.ts{fill:#C0DD97;}.c-gray>rect,rect.c-gray{fill:#444441;stroke:#B4B2A9;}.c-gray>text{fill:#F1EFE8;}.c-gray>.ts{fill:#D3D1C7;}.c-purple>rect,rect.c-purple{fill:#3C3489;stroke:#AFA9EC;}.c-purple>text{fill:#EEEDFE;}.c-purple>.ts{fill:#CECBF6;}.c-blue>rect,rect.c-blue{fill:#0C447C;stroke:#85B7EB;}.c-blue>text{fill:#E6F1FB;}.c-blue>.ts{fill:#B5D4F4;}.c-amber>rect,rect.c-amber{fill:#633806;stroke:#EF9F27;}.c-amber>text{fill:#FAEEDA;}.c-amber>.ts{fill:#FAC775;}.c-red>rect,rect.c-red{fill:#791F1F;stroke:#F09595;}.c-red>text{fill:#FCEBEB;}.c-red>.ts{fill:#F7C1C1;}}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><g class="c-red"><rect x="50" y="60" width="270" height="58" rx="8" stroke-width="0.5"/><text class="th" x="185" y="80" text-anchor="middle" dominant-baseline="central">old: 1 thread per pair</text><text class="ts" x="185" y="100" text-anchor="middle" dominant-baseline="central">binary-search the bucket — log(N)</text></g><g class="c-teal"><rect x="360" y="60" width="270" height="58" rx="8" stroke-width="0.5"/><text class="th" x="495" y="80" text-anchor="middle" dominant-baseline="central">new: 1 block per bucket</text><text class="ts" x="495" y="100" text-anchor="middle" dominant-baseline="central">divide &amp; modulo — no search</text></g><g class="c-green"><rect x="50" y="150" width="200" height="56" rx="8" stroke-width="0.5"/><text class="th" x="150" y="168" text-anchor="middle" dominant-baseline="central">mixed bucket b2</text><text class="ts" x="150" y="188" text-anchor="middle" dominant-baseline="central">tissue A,B · tool x,y,z</text></g><line x1="250" y1="178" x2="294" y2="178" stroke="var(--color-border-primary)" stroke-width="1.5" marker-end="url(#arrow)"/><g class="c-purple"><rect x="300" y="150" width="86" height="34" rx="4" stroke-width="0.5"/><text class="ts" x="343" y="167" text-anchor="middle" dominant-baseline="central">lp0 → (A,x)</text></g><g class="c-purple"><rect x="392" y="150" width="86" height="34" rx="4" stroke-width="0.5"/><text class="ts" x="435" y="167" text-anchor="middle" dominant-baseline="central">lp1 → (A,y)</text></g><g class="c-purple"><rect x="484" y="150" width="86" height="34" rx="4" stroke-width="0.5"/><text class="ts" x="527" y="167" text-anchor="middle" dominant-baseline="central">lp2 → (A,z)</text></g><g class="c-purple"><rect x="300" y="190" width="86" height="34" rx="4" stroke-width="0.5"/><text class="ts" x="343" y="207" text-anchor="middle" dominant-baseline="central">lp3 → (B,x)</text></g><g class="c-purple"><rect x="392" y="190" width="86" height="34" rx="4" stroke-width="0.5"/><text class="ts" x="435" y="207" text-anchor="middle" dominant-baseline="central">lp4 → (B,y)</text></g><g class="c-purple"><rect x="484" y="190" width="86" height="34" rx="4" stroke-width="0.5"/><text class="ts" x="527" y="207" text-anchor="middle" dominant-baseline="central">lp5 → (B,z)</text></g><text class="ts" x="340" y="256" text-anchor="middle" dominant-baseline="central">tissueLocal = lp / 3     ·     toolLocal = lp % 3</text></svg>